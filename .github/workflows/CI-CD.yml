name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-management
          path: target/*.jar
          retention-days: 30

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: task-management
          path: target/
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_USER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USER_NAME }}/task-management:${{ github.sha }}
            ${{ secrets.DOCKER_USER_NAME }}/task-management:latest

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          timeout: 10m
          script: |
            echo "📥 Pulling new image..."
            docker pull ${{ secrets.DOCKER_USER_NAME }}/task-management:latest
            
            echo " Stopping old container..."
            docker stop task-management || true
            docker rm task-management || true
            
            echo "🚀 Starting new container..."
            docker run -d \
              --name task-management \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USER_NAME }}/task-management:latest
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deploy success!"
            docker ps --filter name=task-management
